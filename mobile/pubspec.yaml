name: mobile
description: "SRMS — Smart City Emergency Management mobile client: Emergency Green Wave, road-hazard detection and crime vehicle (ANPR) surveillance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  camera: ^0.12.1
  permission_handler: ^13.0.2
  geolocator: ^13.0.2

  # Sensor & Hardware
  sensors_plus: ^7.1.0        # Accelerometer Z-axis spike detection
  google_fonts: ^6.2.1        # Premium typography

  # AI & Image
  image_picker: ^1.1.2         # Camera/gallery photo picker for AI classification

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
