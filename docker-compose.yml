services:
  postgres:
    image: postgres:16
    container_name: srms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: srms
      POSTGRES_USER: srms
      POSTGRES_PASSWORD: srms_dev_password
    ports:
      - "5432:5432"
    volumes:
      - srms-postgres-data:/var/lib/postgresql/data

volumes:
  srms-postgres-data:
